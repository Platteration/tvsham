name: CI

on:
  # Every branch, not just the default one: this repository does its work on
  # feature branches, so restricting CI to main would mean it never runs.
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Typecheck (shared, server, mobile)
        run: npm run typecheck
      - name: Tests (server and app)
        run: npm test
      - name: Bundle the app with Metro
        run: npx expo export --platform android --output-dir /tmp/export
        working-directory: apps/mobile
        env:
          CI: "1"

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build server image
        run: docker build -f apps/server/Dockerfile -t tvsham-server .
