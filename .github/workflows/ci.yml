name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
  # Weekly, for a tree nobody pushes to: GitHub runs a schedule from the default branch
  # only, where an advisory or a build that has rotted then shows within a week. Not at
  # the top of the hour, a high-load time when scheduled runs can be delayed or dropped
  # (CONVENTIONS.md, "CI").
  schedule:
    - cron: "17 6 * * 1"

# A newer run for the same ref supersedes an in-flight one. On the default branch the
# weekly run shares the group with pushes; whichever is cancelled, the other tests the
# branch's newest commit.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      - run: npm test

      - run: npm run test:conventions

      - run: npx expo export --platform android --output-dir /tmp/export
        working-directory: apps/mobile

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc

      - run: npm audit --omit=dev --audit-level=high

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - run: docker build -f apps/server/Dockerfile -t tvsham-server .
