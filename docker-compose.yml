services:
  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    ports:
      # Loopback only, on purpose. Docker publishes a port by writing its own
      # iptables DNAT rules, which bypass ufw and firewalld, so "8787:8787" puts
      # this server on every interface of the host no matter what the host
      # firewall says - and by default it has no APP_TOKEN and no daily cap, so
      # anyone who finds the port can spend the operator's Claude budget and read
      # back what the household watched. Put a TLS proxy in front of this; widen
      # it only once APP_TOKEN and DAILY_CLIP_LIMIT are set.
      - "127.0.0.1:8787:8787"
    env_file:
      - apps/server/.env
    environment:
      - PORT=8787
    # An upload is held in memory while it is analysed (MAX_UPLOADS_IN_FLIGHT
    # bounds how many at once, at roughly twice the clip size each), so a burst
    # of large clips should meet a limit on this container rather than the
    # host's OOM killer, which picks its victim by size and may not pick this.
    # Raise both together, never one alone.
    mem_limit: 2g
    restart: unless-stopped
