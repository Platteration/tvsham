# TVsham website: nginx configuration. Netlify and Cloudflare Pages read _headers instead; Apache
# reads .htaccess. The same values are in all of them and in the <meta> scripts/build-web.mjs writes
# into index.html, and src/website.test.ts fails when they differ; public/_headers says what each
# source in the policy is for.
#
# Include this file from the http {} block (for example from /etc/nginx/conf.d/), then set
# server_name, root and the certificate paths, and put the origin of your recognition server in
# the policy where it says TVSHAM_SERVER_ORIGIN (https://tvsham.example.com, say): it is the one
# value scripts/build-web.mjs fills in everywhere else, and left as it is the site can reach
# nothing. The server must name this site's origin in CORS_ORIGIN in turn.
#
# root is the folder scripts/build-web.mjs wrote (dist/ by default), copied somewhere of its own.
# Never point it at the repository: .git/ holds its whole history.
#
# The one exception to "this file serves files": location ^~ /api/ below hands the website's
# account and shop to the recognition server, so that the page reaches them on its own origin.

# Cache lifetimes by path: the bundle and the assets carry a content hash in their names, so a new
# build gets new names; everything else is revalidated on every load (an unchanged file costs a 304).
# $uri, not $request_uri: error_page answers a missing file with /404.html and sets $uri to that, so
# a name under the hashed folders that the site does not hold is revalidated too, rather than kept a
# year by a browser that asked for it before the file arrived.
map $uri $tvsham_cache_control {
    default            "no-cache";
    ~^/_expo/static/   "public, max-age=31536000, immutable";
    ~^/assets/         "public, max-age=31536000, immutable";
}

server {
    listen 80;
    listen [::]:80;
    server_name tvsham.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name tvsham.example.com;

    root /var/www/tvsham-web;
    index index.html;

    ssl_certificate     /etc/letsencrypt/live/tvsham.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tvsham.example.com/privkey.pem;

    server_tokens off;
    autoindex off;
    charset utf-8;

    # a missing page, and a folder with no page of its own, both get the site's own 404 page
    error_page 404 /404.html;
    error_page 403 =404 /404.html;
    location = /404.html { internal; }

    # never serve a dotfile, except the folder security.txt lives in
    location ~ /\.(?!well-known/) { return 404; }
    # the hosting files are not part of the site
    location ~ ^/(_headers|_redirects)$ { return 404; }
    # the app's routes are one page: a visit or a reload at one gets index.html, which draws it
    location ~ ^/(settings|library|result)$ { try_files /index.html =404; }

    location / {
        try_files $uri $uri/ =404;
    }

    # The website's account and shop: the recognition server's /api/ (apps/server/src/account.ts),
    # on this site's own origin, because the sign-in is a cookie of this origin. proxy_pass names
    # the server: 127.0.0.1:8787 is where docker-compose.yml publishes it. With no server there,
    # /api/ answers 502 and the page draws no sign-in and no shop; delete the block to serve the
    # site without one. ^~ wins over the regular expressions above that refuse dotfiles and the
    # hosting files, and proxy_pass has no URI, so the path reaches the server unchanged. Under a
    # path (WEB_BASE_URL=/tvsham), the location is /tvsham/api/ and APP_URL carries the path.
    #
    # The server answers more than the account (/health, /sessions), so two lines keep this block
    # to the account's paths and to the caller's own address. A backslash is a character to nginx
    # and a slash to the server's URL parser: /api/..\..\sessions is under /api/ here and is
    # /sessions to the parser, so a path with one is refused (no browser sends one; the server
    # refuses it too). And the address nginx saw is appended to X-Forwarded-For, which the
    # server reads from the right under TRUST_PROXY: passed on as the client wrote it, the
    # header chose the bucket the daily cap, the session ceilings and the token's guess limit
    # counted against.
    location ^~ /api/ {
        if ($request_uri ~ "^[^?]*\x5c") { return 400; }
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 1m;
        proxy_read_timeout 30s;
        # One add_header here means none of the server block's is inherited, so the API's own
        # headers go out alone. This is the server block's Strict-Transport-Security line, as written there.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self' 'sha256-47DEQpj8HBSa+/TImW+5JCeuQeRkm5NMpJWZG3hSuFU='; img-src 'self' https://upload.wikimedia.org https://i.ytimg.com https://image.tmdb.org; media-src blob:; connect-src 'self' TVSHAM_SERVER_ORIGIN; base-uri 'none'; form-action 'none'; object-src 'none'; frame-ancestors 'none'; upgrade-insecure-requests; require-trusted-types-for 'script'; trusted-types 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "accelerometer=(), autoplay=(), browsing-topics=(), camera=(), clipboard-read=(), clipboard-write=(), display-capture=(), encrypted-media=(), fullscreen=(), gamepad=(), geolocation=(), gyroscope=(), hid=(), idle-detection=(), local-fonts=(), magnetometer=(), microphone=(), midi=(), otp-credentials=(), payment=(), picture-in-picture=(), publickey-credentials-create=(), publickey-credentials-get=(), screen-wake-lock=(), serial=(), storage-access=(), usb=(), window-management=(), xr-spatial-tracking=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Cache-Control $tvsham_cache_control always;
}
